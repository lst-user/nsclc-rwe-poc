[project]
name = "nsclc-rwe-poc"
version = "0.1.0"
description = "Prototype Claude API tool-use agent for NSCLC real-world evidence (OMOP CDM Postgres + OHDSI Atlas)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["streamlit>=1.38"]

[project.scripts]
nsclc-agent = "nsclc_rwe.agent:main"
nsclc-nl-to-cohort = "nsclc_rwe.nl_to_cohort:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsclc_rwe"]
